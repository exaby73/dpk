version: ^1.0.0

scripts:
  analyze: dart analyze

  clean: dart run build_runner clean

  before:
    scripts:
      - analyze
      - get
      - publish
    command: dpk run build

  pre:build: echo "Cleaning build..." && dpk run clean
  build: dart run build_runner build

  watch:
    run_hooks_from: build
    command: dart run build_runner watch

  publish: dart pub publish

  post:get:
    description: Install the bundled dpk skill for local agents
    command: >-
      npx -y skills@1.7.0 add ./skills/dpk -y -a claude-code codex &&
      dart run tool/normalize_skills_lock.dart
