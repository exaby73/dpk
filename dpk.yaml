version: ^0.6.0

mode: project

scripts:
  analyze: dart analyze

  clean: dart run build_runner clean

  pre:build: dpk run clean
  build: dart run build_runner build -d

  watch:
    runHooksFrom: build
    command: dart run build_runner watch -d

  publish:
    runHooksFrom: build
    command: dart pub publish -f
