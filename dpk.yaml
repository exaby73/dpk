# yaml-language-server: $schema=https://raw.githubusercontent.com/exaby73/dpk/main/schema/dpk.schema.json
version: ^1.0.0

scripts:
  analyze: dart analyze

  clean: dart run build_runner clean

  before:
    scripts:
      - analyze
      - get
      - release
    command: dpk run build

  pre:build: echo "Cleaning build..." && dpk run clean
  build:
    command: dart run build_runner build
    description: Regenerate the embedded version and dpk skill.

  watch:
    run_hooks_from: build
    command: dart run build_runner watch

  post:version:
    command: dpk run build
    description: Regenerate the embedded version before the release commit.

  post:get:
    description: Install the bundled dpk skill for local agents
    command: >-
      npx -y skills@1.7.0 add ./skills/dpk -y -a claude-code codex &&
      dart run tool/normalize_skills_lock.dart
