mode: global

scripts:
  activate: dart pub global activate --source path . --overwrite
  analyze: dart analyze

  preget: |
    echo --------------------------------
    echo Preget script
    echo --------------------------------
  postget: |
    echo --------------------------------
    echo Postget script
    echo --------------------------------

  clean: dart run build_runner clean

  prebuild: dpk run clean
  build: dart run build_runner build -d
  postbuild: echo "Build completed successfully"

  watch:
    runHooksFrom: build
    command: dart run build_runner watch -d

  # Test commands
  echo: echo
