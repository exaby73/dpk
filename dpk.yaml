version: ^0.6.0

mode: project

scripts:
  analyze: dart analyze

  clean: dart run build_runner clean

  pre:build: echo "Cleaning build..." && dpk run clean
  build: dart run build_runner build -d

  watch:
    runHooksFrom: build
    command: dart run build_runner watch -d

  publish:
    command: |
      dpk run build
      dart pub publish
