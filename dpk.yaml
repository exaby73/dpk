version: ^0.8.0

mode: project

scripts:
  analyze: dart analyze

  clean: dart run build_runner clean

  before:
    scripts:
      - analyze
      - get
      - publish
    command: dpk run build

  pre:build: echo "Cleaning build..." && dpk run clean
  build: dart run build_runner build

  watch:
    runHooksFrom: build
    command: dart run build_runner watch

  publish: dart pub publish
