mode: global

scripts:
  activate: dart pub global activate --source path . --overwrite
  analyze: dart analyze

  preget: |
    echo --------------------------------
    echo Preget script
    echo --------------------------------
  postget: |
    echo --------------------------------
    echo Postget script
    echo --------------------------------

  clean: dpk run build_runner clean

  prebuild: dpk run clean
  build: dpk run build_runner -- build -d

  watch:
    runHooksFrom: build
    command: dpk run build_runner -- watch -d
