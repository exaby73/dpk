scripts:
  activate: dart pub global activate --source path . --overwrite

  preget: |
    echo --------------------------------
    echo Preget script
    echo --------------------------------
  postget: |
    echo --------------------------------
    echo Postget script
    echo --------------------------------

  clean: dpm run build_runner clean

  prebuild: dpm run clean
  build: dpm run build_runner -- build -d

  watch:
    runHooksFrom: build
    command: dpm run build_runner -- watch -d
