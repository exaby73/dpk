name: dpk
description: >-
  A package manager for Dart that adds scripts, hooks, workspace runs, a
  dependency catalog, patches, and releases to dart pub.
version: 0.8.3
repository: https://github.com/exaby73/dpk
issue_tracker: https://github.com/exaby73/dpk/issues
topics:
  - cli
  - package-manager
  - monorepo
  - workspace
  - scripts

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.1
  collection: ^1.19.1
  embed_annotation: ^1.2.3
  glob: ^2.2.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.16.1
  embed: ^1.7.1
  lint: ^2.12.0
  test: ^1.32.0
  test_descriptor: ^2.0.2

executables:
  dpk:
