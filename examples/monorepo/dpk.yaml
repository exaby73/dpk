version: ^1.0.0

mode: project
sort_pubspec: true

workspace:
  - packages/*

catalog:
  environment:
    sdk: ^3.11.0

  version: 1.2.3
  resolution: workspace
  publish_to: none
  homepage: https://example.com/DPK_PACKAGE_NAME
  repository: https://github.com/exaby73/dpk/tree/main/examples/monorepo/DPK_PACKAGE_PATH
  issue_tracker: https://github.com/exaby73/dpk/issues
  documentation: https://pub.dev/documentation/DPK_PACKAGE_NAME/DPK_PACKAGE_VERSION/
  topics:
    - dpk
  funding:
    - https://github.com/sponsors/DPK_PACKAGE_NAME
  platforms:
    linux:
    macos:

  dependencies:
    build_runner: 2.15.1
    meta: 1.19.0
    luthor:
      git:
        url: https://github.com/exaby73/luthor.git
        path: packages/luthor

scripts:
  env:
    command: echo $FOO
    env:
      FOO: bar
  pwd_single:
    command: pwd
  pubget:
    command: dart pub get
    run_in_packages:
      - "**/*"
  pwd:
    command: pwd
    run_in_packages:
      - "**/*"
  pwd_from_root:
    command: 'echo "ROOT: $DPK_ROOT" && cd $DPK_ROOT && pwd'
    run_in_packages:
      - "**/*"

  pre:build:
    command: dart run build_runner clean
    run_in_packages:
      - "**/*"
  build:
    command: dart run build_runner build -d
    run_in_packages:
      - "**/*"
  post:build: echo "Build completed successfully"

  pre:only_1:
    command: 'echo "Pre script: $(pwd)"'
    run_in_packages:
      - "packages/*"
  only_1:
    command: 'echo "Only script: $(pwd)"'
    run_in_packages:
      - "**/*"
