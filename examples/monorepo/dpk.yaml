# yaml-language-server: $schema=https://raw.githubusercontent.com/exaby73/dpk/main/schema/dpk.schema.json
version: ^1.0.0

mode: project
sort_pubspec: true

workspace:
  - packages/*

catalog:
  environment:
    sdk: ^3.11.0

  version: 1.2.3
  resolution: workspace
  publish_to: none
  homepage: https://example.com/DPK_PACKAGE_NAME
  repository: https://github.com/exaby73/dpk/tree/main/examples/monorepo/DPK_PACKAGE_PATH
  issue_tracker: https://github.com/exaby73/dpk/issues
  documentation: https://pub.dev/documentation/DPK_PACKAGE_NAME/DPK_PACKAGE_VERSION/
  topics:
    - dpk
  funding:
    - https://github.com/sponsors/DPK_PACKAGE_NAME
  platforms:
    linux:
    macos:

  dependencies:
    meta: 1.19.0
    lints: ^6.1.0
    test: ^1.32.0
    luthor:
      git:
        url: https://github.com/exaby73/luthor.git
        path: packages/luthor

scripts:
  analyze:
    command: dart analyze
    description: Analyze every package.
    run_in_packages: [packages/*]

  test:
    command: dart test
    description: Analyze, then test every package.
    run_in_packages: [packages/*]
    fail_fast: true
    depends_on: [analyze]
  pre:test: echo "Starting the tests"
  post:test: echo "Every package passed"

  where:
    command: 'echo "$DPK_PACKAGE_NAME at $DPK_PACKAGE_PATH, root $DPK_ROOT"'
    description: Show where each package runs.
    run_in_packages: [packages/*]

  greet:
    command: echo "$GREETING"
    description: Print a greeting from env.
    env:
      GREETING: Hello from dpk
